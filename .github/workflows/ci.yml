name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight package
        run: python -m pip install -e ".[dev]"
      - name: Lint and compile
        run: make lint
      - name: Unit tests
        run: make test
      - name: Config validation
        run: make config-check
      - name: Artifact manifest validation
        run: make artifacts-check
      - name: Smoke test
        run: make smoke-test
